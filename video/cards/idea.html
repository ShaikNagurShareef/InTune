<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The idea</title><link rel="stylesheet" href="card.css">
<style>
  .flow { display: flex; align-items: center; gap: 18px; }
  .who { width: 250px; background: #fcfbf8; border: 1px solid #dfdad0; border-radius: 22px; padding: 24px; }
  .who p { font-size: 20px; color: #4f5c57; }
  .hub { width: 290px; background: #635b9e; color: #f6f4ef; border-radius: 22px; padding: 24px; }
  .hub p { font-size: 20px; color: #ecebf5; }
  .arrows { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; }
</style></head>
<body style="background:#ebe7de" data-step="0">
  <p class="eyebrow">Our idea</p>
  <h2 data-show="1">Nobody should have to become someone else to be understood.</h2>
  <div class="flow" data-show="2">
    <div class="who"><h3>Maya</h3><p>autistic · writes in shorthand</p></div>
    <div class="arrows"><span style="color:#3e7b70">clear words →</span><span class="ai">← plain words</span></div>
    <div class="hub"><h3>InTune ✨</h3><p>interprets both ways</p></div>
    <div class="arrows"><span style="color:#3e7b70">clear words →</span><span class="ai">← plain words</span></div>
    <div class="who"><h3>Priya</h3><p>her sister · talks in hints</p></div>
  </div>
</body>
</html>
